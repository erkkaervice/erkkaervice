<svg xmlns="http://www.w3.org/2000/svg" width="960" height="168" viewBox="0 0 960 168" fill="none" role="img" aria-label="Erkka Ala-Lahti — Software Developer and IT Specialist">
  <defs>
    <linearGradient id="rule-light" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e4e4e7" stop-opacity="1"/>
      <stop offset="78%" stop-color="#e4e4e7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e4e4e7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trace-light" x1="732" y1="114" x2="942" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Minimalist architectural topology mark (right) -->
  <g opacity="0.96">
    <line x1="704" y1="34" x2="956" y2="34" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="704" y1="74" x2="956" y2="74" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="704" y1="114" x2="956" y2="114" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="732" y1="16" x2="732" y2="128" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="802" y1="16" x2="802" y2="128" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="872" y1="16" x2="872" y2="128" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="942" y1="16" x2="942" y2="128" stroke="#e4e4e7" stroke-width="1"/>

    <path d="M 704 114 H 732 L 767 74 H 802" stroke="#a1a1aa" stroke-width="1.25"/>
    <path d="M 802 74 L 837 114 H 942" stroke="#a1a1aa" stroke-width="1.25"/>
    <path d="M 732 114 L 802 74 H 872 L 942 34" stroke="url(#trace-light)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="732" cy="114" r="3.8" fill="#ffffff" stroke="#a1a1aa" stroke-width="1.5"/>
    <circle cx="802" cy="74" r="4.2" fill="#ffffff" stroke="#0284c7" stroke-width="1.75"/>
    <circle cx="872" cy="74" r="3.8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="942" cy="34" r="4.6" fill="#059669"/>
    <circle cx="942" cy="34" r="9.5" stroke="#059669" stroke-opacity="0.32" stroke-width="1"/>

    <text x="732" y="146" text-anchor="middle" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.2">OPS</text>
    <text x="802" y="146" text-anchor="middle" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.2">SEC</text>
    <text x="872" y="146" text-anchor="middle" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.2">APP</text>
    <text x="942" y="146" text-anchor="middle" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.2">AI</text>
  </g>

  <!-- Left typographic column -->
  <circle cx="6" cy="28" r="3.8" fill="#059669"/>
  <text x="18" y="32" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.4">DEVOPS  ·  IT SYSTEMS  ·  SECURITY  ·  FULL-STACK  ·  AGENTIC AI</text>

  <text x="0" y="90" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.4">Erkka Ala-Lahti</text>

  <text x="1" y="126" fill="#3f3f46" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">Software Developer &amp; IT Specialist — DevOps, systems, security, full-stack &amp; AI.</text>

  <rect x="0" y="166" width="960" height="1" fill="url(#rule-light)"/>
