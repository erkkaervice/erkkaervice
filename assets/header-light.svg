<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="196" viewBox="0 0 1200 196" fill="none" role="img" aria-label="Erkka Ala-Lahti — Systems, Full-Stack and Infrastructure Engineer">
  <defs>
    <linearGradient id="rule-light" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e4e4e7" stop-opacity="1"/>
      <stop offset="72%" stop-color="#e4e4e7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e4e4e7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trace-light" x1="810" y1="138" x2="1182" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Subtle architectural coordinate mark (right) -->
  <g opacity="0.9">
    <line x1="820" y1="42" x2="1184" y2="42" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="820" y1="90" x2="1184" y2="90" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="820" y1="138" x2="1184" y2="138" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="876" y1="22" x2="876" y2="158" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="972" y1="22" x2="972" y2="158" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="1068" y1="22" x2="1068" y2="158" stroke="#e4e4e7" stroke-width="1"/>
    <line x1="1164" y1="22" x2="1164" y2="158" stroke="#e4e4e7" stroke-width="1"/>

    <!-- Secondary topology paths -->
    <path d="M 820 138 H 876 L 924 90 H 972" stroke="#d4d4d8" stroke-width="1.25"/>
    <path d="M 972 90 L 1020 138 H 1164" stroke="#d4d4d8" stroke-width="1.25"/>

    <!-- Primary crisp signal path -->
    <path d="M 876 138 L 972 90 H 1068 L 1164 42" stroke="url(#trace-light)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Precision nodes -->
    <circle cx="876" cy="138" r="3.5" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
    <circle cx="972" cy="90" r="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.75"/>
    <circle cx="1068" cy="90" r="3.5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="1164" cy="42" r="4.5" fill="#059669"/>
    <circle cx="1164" cy="42" r="9" stroke="#059669" stroke-opacity="0.28" stroke-width="1"/>

    <!-- Minimal micro-coordinates -->
    <text x="876" y="172" text-anchor="middle" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" letter-spacing="1.2">SYS</text>
    <text x="972" y="172" text-anchor="middle" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" letter-spacing="1.2">API</text>
    <text x="1068" y="172" text-anchor="middle" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" letter-spacing="1.2">SEC</text>
    <text x="1164" y="172" text-anchor="middle" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" letter-spacing="1.2">OPS</text>
  </g>

  <!-- Editorial typographic left column -->
  <circle cx="6" cy="36" r="3.5" fill="#059669"/>
  <text x="20" y="40" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="2.2">SYSTEMS  ·  FULL-STACK  ·  INFRASTRUCTURE</text>

  <text x="0" y="106" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.6">Erkka Ala-Lahti</text>

  <text x="2" y="146" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400">Hardened Linux infrastructure, TypeScript platforms &amp; governed AI workflows.</text>

  <!-- Hairline bottom divider -->
  <rect x="0" y="194" width="1200" height="1" fill="url(#rule-light)"/>
</svg>
